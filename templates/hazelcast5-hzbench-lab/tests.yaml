# =============================================================================
# hzbench-equivalent tests for Hazelcast Simulator
# =============================================================================
# Replicates the hzbench two-phase benchmark suite:
#   Phase 1: Max throughput (at known optimal thread count from hzbench)
#   Phase 2: Fixed-rate latency (at 1/5 of max throughput)
#
# Instructions:
#   1. Replace threadCount values with optimal counts from your hzbench runs
#   2. Replace ratePerSecond values with max_throughput/5 from hzbench runs
#   3. Adjust duration/warmup to match your hzbench config (default: 15min)
#
# Test class: LongByteArrayMapTest (uses Long keys vs hzbench's Integer keys,
# negligible impact on client performance measurements)
# =============================================================================

# =============================================================================
# Phase 1: Max Throughput Tests
# =============================================================================

# --- PUT 4B ---
- name: max-throughput-put-4
  duration: 900s
  repetitions: 1
  clients: 1
  members: 3
  driver: hazelcast5
  version: maven=5.6.0
  client_args: >
    -Xms4g -Xmx4g
    --add-modules java.se
    --add-exports java.base/jdk.internal.ref=ALL-UNNAMED
    --add-opens java.base/java.lang=ALL-UNNAMED
    --add-opens java.base/sun.nio.ch=ALL-UNNAMED
    --add-opens java.management/sun.management=ALL-UNNAMED
    --add-opens jdk.management/com.sun.management.internal=ALL-UNNAMED
  member_args: >
    -Xms4g -Xmx4g
    --add-modules java.se
    --add-exports java.base/jdk.internal.ref=ALL-UNNAMED
    --add-opens java.base/java.lang=ALL-UNNAMED
    --add-opens java.base/sun.nio.ch=ALL-UNNAMED
    --add-opens java.management/sun.management=ALL-UNNAMED
    --add-opens jdk.management/com.sun.management.internal=ALL-UNNAMED
  loadgenerator_hosts: loadgenerators
  node_hosts: nodes
  verify_enabled: False
  performance_monitor_interval_seconds: 1
  warmup_seconds: 150
  cooldown_seconds: 0
  test:
    - class: com.hazelcast.simulator.tests.map.LongByteArrayMapTest
      name: benchmarkMap
      threadCount: 245          # <-- set from hzbench optimal
      getProb: 0
      putProb: 1
      keyDomain: 100_000
      valueCount: 1
      minValueLength: 4
      maxValueLength: 4

